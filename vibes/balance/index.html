<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fulcrum</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Crimson+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">

<style>
  :root {
    --paper:  #0e3a63;
    --paper2: #0a2c4d;
    --ink:    #e9f2fc;
    --ink-2:  #93b4d6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(120% 90% at 50% -20%, #14497a 0%, var(--paper) 45%, var(--paper2) 100%);
    color: var(--ink);
    overflow: hidden;
    cursor: crosshair;
    -webkit-user-select: none;
    user-select: none;
    font-family: "Crimson Pro", Georgia, serif;
  }
  body.resolved { cursor: default; }

  svg#sheet { position: fixed; inset: 0; display: block; }

  /* ---- SVG element styling (class-driven so geometry stays in attributes) ---- */
  .grid-min { stroke: rgba(255,255,255,.045); stroke-width: 1; }
  .grid-maj { stroke: rgba(255,255,255,.085); stroke-width: 1; }
  .frame    { fill: none; stroke: rgba(255,255,255,.16); stroke-width: 1; }
  .baseline { stroke: rgba(255,255,255,.10); stroke-width: 1; stroke-dasharray: 1 8; }

  .ln    { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; }
  .dash  { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 7 7; }
  .ring  { fill: none; stroke: var(--ink); stroke-width: 1.7; }
  .dot   { fill: var(--ink); }

  .dim   { fill: none; stroke: var(--ink-2); stroke-width: 1; }
  .ext   { fill: none; stroke: var(--ink-2); stroke-width: 1; opacity: .55; }

  .tri       { stroke: var(--ink);   stroke-width: 1.5; fill: rgba(233,242,252,.10); stroke-linejoin: round; }
  .tri-ghost { stroke: var(--ink-2); stroke-width: 1.3; fill: none; stroke-dasharray: 4 4; stroke-linejoin: round; }

  .ghost { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 3 6; opacity: .45; }

  .txt   { font-family: "Architects Daughter", cursive; fill: var(--ink);   font-size: 16px; letter-spacing: .3px; }
  .txt-d { font-family: "Architects Daughter", cursive; fill: var(--ink-2); font-size: 15px; letter-spacing: .3px; }

  /* ---- HTML overlay (pointer-transparent except the button) ---- */
  .overlay { position: fixed; pointer-events: none; }

  #title {
    top: 22px; left: 30px;
    font-size: 30px; font-weight: 500; letter-spacing: 6px;
    text-transform: lowercase;
    opacity: .95;
  }
  #title::after {
    content: ""; display: block;
    width: 46px; height: 1px; margin-top: 6px;
    background: var(--ink-2); opacity: .6;
  }

  #stats {
    top: 24px; right: 30px;
    font-family: "Architects Daughter", cursive;
    display: grid; grid-template-columns: auto auto;
    gap: 2px 16px; text-align: right;
    font-size: 17px;
  }
  #stats .k { color: var(--ink-2); letter-spacing: 2px; text-transform: uppercase; font-size: 13px; align-self: center; }
  #stats .v { color: var(--ink); }

  #result {
    top: 12%; left: 0; right: 0;
    text-align: center;
    opacity: 0; transition: opacity .4s ease .1s;
  }
  #result.show { opacity: 1; }
  #score {
    font-size: 84px; font-weight: 300; line-height: 1;
    letter-spacing: 1px;
  }
  #score .deg { font-size: 46px; opacity: .7; }
  #scoreCap {
    font-family: "Architects Daughter", cursive;
    color: var(--ink-2);
    font-size: 16px; letter-spacing: 4px; text-transform: uppercase;
    margin-top: 8px;
  }

  #tryagain {
    left: 0; right: 0; bottom: 7%;
    text-align: center;
    opacity: 0; transition: opacity .4s ease .15s;
  }
  #tryagain.show { opacity: 1; }
  #tryagain button {
    pointer-events: auto;
    font-family: "Architects Daughter", cursive;
    font-size: 19px; letter-spacing: 2px;
    color: var(--ink);
    background: rgba(233,242,252,.04);
    border: 1px solid var(--ink-2);
    border-radius: 2px;
    padding: 9px 26px;
    cursor: pointer;
    transition: background .2s ease, border-color .2s ease;
  }
  #tryagain button:hover { background: rgba(233,242,252,.12); border-color: var(--ink); }
  #tryagain button:active { transform: translateY(1px); }

  /* ---- intro / how-to overlay ---- */
  #intro {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background: radial-gradient(120% 90% at 50% 28%, rgba(20,73,122,.5), rgba(7,25,44,.82));
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
    transition: opacity .5s ease;
    cursor: pointer;
  }
  #intro.hide { opacity: 0; pointer-events: none; }
  .intro-card {
    width: 100%; max-width: 384px;
    padding: 32px 34px 28px; text-align: center;
    background: rgba(13, 49, 83, .72);
    border: 1px solid rgba(147,180,214,.5); border-radius: 3px;
    box-shadow: 0 24px 70px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.04);
    cursor: default;
  }
  .intro-card h1 {
    font-family: "Crimson Pro", serif; font-weight: 500;
    font-size: 30px; letter-spacing: 7px; text-transform: lowercase; color: var(--ink);
  }
  .intro-rule { width: 46px; height: 1px; margin: 9px auto 20px; background: var(--ink-2); opacity: .6; }
  .intro-dia { width: 100%; max-width: 230px; height: auto; display: block; margin: 0 auto 20px; opacity: .95; }
  .intro-card p {
    font-family: "Crimson Pro", serif; font-weight: 300;
    font-size: 17px; line-height: 1.5; color: var(--ink);
    margin: 0 auto 10px; max-width: 304px;
  }
  .intro-card p em { font-style: normal; color: var(--ink-2); }
  .intro-card button {
    margin-top: 16px;
    font-family: "Architects Daughter", cursive;
    font-size: 19px; letter-spacing: 2px; color: var(--ink);
    background: rgba(233,242,252,.05);
    border: 1px solid var(--ink-2); border-radius: 2px;
    padding: 9px 32px; cursor: pointer;
    transition: background .2s ease, border-color .2s ease;
  }
  .intro-card button:hover { background: rgba(233,242,252,.13); border-color: var(--ink); }
  .intro-card button:active { transform: translateY(1px); }
</style>
</head>
<body>
  <svg id="sheet" xmlns="http://www.w3.org/2000/svg"></svg>

  <div class="overlay" id="title">fulcrum</div>

  <div class="overlay" id="stats">
    <div class="k">Rounds</div><div class="v" id="stRounds">0</div>
    <div class="k">Best</div><div class="v" id="stBest">&mdash;</div>
    <div class="k">Avg</div><div class="v" id="stAvg">&mdash;</div>
  </div>

  <div class="overlay" id="result">
    <div id="score">0<span class="deg">&deg;</span></div>
    <div id="scoreCap">lean</div>
  </div>

  <div class="overlay" id="tryagain">
    <button type="button" id="againBtn">try again</button>
  </div>

  <div id="intro">
    <div class="intro-card" role="dialog" aria-label="How to play">
      <h1>fulcrum</h1>
      <div class="intro-rule"></div>
      <svg class="intro-dia" viewBox="0 0 260 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <line x1="28" y1="82" x2="232" y2="82" class="baseline" />
        <g transform="rotate(7 130 50)">
          <line x1="46" y1="50" x2="214" y2="50" class="ln" />
          <circle cx="46"  cy="50" r="16" class="ring" />
          <circle cx="214" cy="50" r="22" class="ring" />
          <circle cx="46"  cy="50" r="2.4" class="dot" />
          <circle cx="214" cy="50" r="2.4" class="dot" />
        </g>
        <path d="M130 50 L117 74 L143 74 Z" class="tri" />
      </svg>
      <p>Two discs of unequal weight rest on a level beam.</p>
      <p>Tap to set the <em>fulcrum</em> where you think it balances. The beam tips to reveal its lean &mdash; aim for 0&deg;.</p>
      <button type="button" id="beginBtn">begin</button>
    </div>
  </div>

<script>
(() => {
  "use strict";

  const SVGNS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("sheet");

  const R = Math.round;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rand  = (a, b) => a + Math.random() * (b - a);

  const MAXA = 20;          // degrees of lean at the worst possible placement
  const PERFECT = 0.4;      // below this counts as a clean balance

  // ---- state ----------------------------------------------------------------
  let round = null;         // { fracL, fracR, radL, radR }  (fractions)
  let pivotFrac = null;     // chosen fulcrum, fraction of width
  let resolved = false;
  let animating = false;
  const stats = { rounds: 0, sum: 0, best: Infinity };

  // ---- tiny SVG builder -----------------------------------------------------
  function S(tag, attrs, ...kids) {
    const e = document.createElementNS(SVGNS, tag);
    if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
    for (const kid of kids) e.appendChild(typeof kid === "string" ? document.createTextNode(kid) : kid);
    return e;
  }
  const line  = (x1,y1,x2,y2,cls)        => S("line",{x1,y1,x2,y2,class:cls});
  const text  = (x,y,str,cls,anchor)     => { const t=S("text",{x,y,class:cls||"txt"},str); if(anchor) t.setAttribute("text-anchor",anchor); return t; };
  const ext   = (x1,y1,x2,y2)            => line(x1,y1,x2,y2,"ext");
  const arrow = (x1,y1,x2,y2) => S("line",{x1,y1,x2,y2,class:"dim","marker-start":"url(#arw)","marker-end":"url(#arw)"});

  // ---- geometry from current viewport --------------------------------------
  function metrics() {
    const W = window.innerWidth, H = window.innerHeight, midY = H / 2;
    let xL = round.fracL * W, xR = round.fracR * W;
    const rMax = (xR - xL) * 0.40;
    let rL = Math.min(round.radL * Math.min(W, H), rMax);
    let rR = Math.min(round.radR * Math.min(W, H), rMax);

    // ---- responsive fit -----------------------------------------------------
    // The ⌀ / weight callouts sit on the OUTER side of each circle. On a narrow
    // screen they can run off the edge, so shrink the assembly toward centre by
    // just enough that both outer callouts (and a little rotation slack) stay on.
    const PAD = 15, GAP = 24, OFF = 8, CHARW = 9, ROT = 12;
    const dig  = n => String(Math.round(n)).length;
    const foot = r => GAP + OFF + (2 + Math.max(dig(2 * r), dig(Math.PI * r * r / 100))) * CHARW + ROT;
    const cx = W / 2;
    const s = Math.min(1,
      (cx - PAD - foot(rL)) / ((cx - xL) + rL),
      (cx - PAD - foot(rR)) / ((xR - cx) + rR));
    if (s < 1 && s > 0) { xL = cx + (xL - cx) * s; xR = cx + (xR - cx) * s; rL *= s; rR *= s; }

    const span = xR - xL;
    const wL = Math.PI * rL * rL, wR = Math.PI * rR * rR;   // weight = surface area
    const idealX = (wL * xL + wR * xR) / (wL + wR);          // centre of mass
    const o = { W, H, midY, xL, xR, rL, rR, wL, wR, idealX, maxR: Math.max(rL, rR) };
    if (pivotFrac != null) {
      const px = pivotFrac * W;
      const net = wR * (xR - px) - wL * (px - xL);
      const maxMag = Math.max(wL, wR) * span;
      o.px = px;
      o.leanDeg = MAXA * net / maxMag;
      o.gap = px - idealX;
    }
    return o;
  }

  // ---- defs (grid pattern + arrowhead) -------------------------------------
  function buildDefs() {
    const defs = S("defs");
    const pmin = S("pattern", { id:"gmin", width:28, height:28, patternUnits:"userSpaceOnUse" });
    pmin.appendChild(S("path", { d:"M28 0 H0 V28", class:"grid-min", fill:"none" }));
    const pmaj = S("pattern", { id:"gmaj", width:140, height:140, patternUnits:"userSpaceOnUse" });
    pmaj.appendChild(S("path", { d:"M140 0 H0 V140", class:"grid-maj", fill:"none" }));
    const arw = S("marker", { id:"arw", markerWidth:11, markerHeight:11, refX:8.5, refY:3,
                              orient:"auto-start-reverse", markerUnits:"userSpaceOnUse" });
    arw.appendChild(S("path", { d:"M0,0 L8.5,3 L0,6", fill:"none", stroke:"var(--ink-2)", "stroke-width":1 }));
    defs.append(pmin, pmaj, arw);
    return defs;
  }

  // ---- fulcrum triangle path ------------------------------------------------
  const triPath = (x, y) => `M${x} ${y} L${x-15} ${y+24} L${x+15} ${y+24} Z`;

  // ---- main render ----------------------------------------------------------
  function draw() {
    const g = metrics();
    const { W, H, midY } = g;

    while (svg.firstChild) svg.removeChild(svg.firstChild);
    svg.setAttribute("width", W);
    svg.setAttribute("height", H);

    svg.appendChild(buildDefs());
    svg.appendChild(S("rect", { x:0, y:0, width:W, height:H, fill:"url(#gmin)" }));
    svg.appendChild(S("rect", { x:0, y:0, width:W, height:H, fill:"url(#gmaj)" }));
    svg.appendChild(S("rect", { x:14, y:14, width:W-28, height:H-28, class:"frame", rx:2 }));
    svg.appendChild(line(40, midY, W-40, midY, "baseline"));

    // rotating assembly: rod + circles + centre dots ------------------------
    const asm = S("g", { id:"assembly" });
    const innerL = g.xL + g.rL, innerR = g.xR - g.rR;
    asm.appendChild(line(g.xL, midY, innerL, midY, "dash"));   // centre-line in left circle
    asm.appendChild(line(innerL, midY, innerR, midY, "ln"));   // exposed rod
    asm.appendChild(line(innerR, midY, g.xR, midY, "dash"));   // centre-line in right circle
    asm.appendChild(S("circle", { cx:g.xL, cy:midY, r:g.rL, class:"ring" }));
    asm.appendChild(S("circle", { cx:g.xR, cy:midY, r:g.rR, class:"ring" }));
    asm.appendChild(S("circle", { cx:g.xL, cy:midY, r:3, class:"dot" }));
    asm.appendChild(S("circle", { cx:g.xR, cy:midY, r:3, class:"dot" }));

    if (resolved) {
      asm.setAttribute("transform", `rotate(${g.leanDeg} ${g.px} ${midY})`);
      addAttachedDims(asm, g);   // callouts that ride with the tilted rod
    }
    svg.appendChild(asm);

    if (pivotFrac != null) {
      svg.appendChild(S("path", { d: triPath(g.px, midY), class:"tri" }));   // chosen fulcrum
      if (resolved) addGroundDims(g);                                        // ideal fulcrum + gap
    } else {
      svg.appendChild(line(0, 0, 0, 0, "ghost"));   // hover guide (id via class lookup)
      svg.lastChild.id = "ghost";
    }
  }

  // dimensions glued to the assembly (local space is un-rotated) -------------
  function addAttachedDims(asm, g) {
    const { midY, xL, xR, rL, rR, px, maxR } = g;

    // circle size (diameter) + weight, stacked on the outer side of each circle
    sizeCallout(asm, xL, midY, rL, g.wL, -1);
    sizeCallout(asm, xR, midY, rR, g.wR, +1);

    // distances from each circle centre to the fulcrum, on a row below the rod
    const dy = midY + maxR + 38;
    asm.append(ext(xL, midY, xL, dy), ext(px, midY, px, dy), ext(xR, midY, xR, dy));
    asm.appendChild(arrow(xL, dy, px, dy));
    asm.appendChild(arrow(px, dy, xR, dy));
    asm.appendChild(text((xL+px)/2, dy-8, String(R(px - xL)), "txt", "middle"));
    asm.appendChild(text((px+xR)/2, dy-8, String(R(xR - px)), "txt", "middle"));
  }

  function sizeCallout(asm, cx, cy, r, w, dir) {
    const dx = cx + dir * (r + 24);
    asm.append(ext(cx, cy - r, dx, cy - r), ext(cx, cy + r, dx, cy + r));
    asm.appendChild(arrow(dx, cy - r, dx, cy + r));
    const tx = dx + dir * 8, anc = dir < 0 ? "end" : "start";
    asm.appendChild(text(tx, cy - 3, "⌀ " + R(2 * r), "txt", anc));
    asm.appendChild(text(tx, cy + 17, "W " + R(w / 100), "txt-d", anc));
  }

  // ground-space dimensions: ideal fulcrum + offset from the chosen one ------
  function addGroundDims(g) {
    const { midY, px, idealX, gap } = g;
    svg.appendChild(S("path", { d: triPath(idealX, midY), class:"tri-ghost" }));
    svg.appendChild(text(idealX, midY + 40, "ideal", "txt-d", "middle"));

    const dy = midY - 34;
    svg.append(ext(px, midY, px, dy), ext(idealX, midY, idealX, dy));
    svg.appendChild(arrow(px, dy, idealX, dy));
    svg.appendChild(text((px + idealX) / 2, dy - 8, "Δ " + R(Math.abs(gap)), "txt", "middle"));
  }

  // ---- damped settle animation ---------------------------------------------
  function animateTilt(target, px, py, done) {
    const asm = document.getElementById("assembly");
    const start = performance.now();
    const DUR = 1450, decay = 3.2, freq = 7.4;
    function frame(now) {
      const ms = now - start, t = ms / 1000;
      let a;
      if (ms >= DUR) { a = target; }
      else { a = target * (1 - Math.exp(-decay * t) * Math.cos(freq * t)); }
      asm.setAttribute("transform", `rotate(${a} ${px} ${py})`);
      if (ms >= DUR) { done(); return; }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  // ---- interaction ----------------------------------------------------------
  function onPick(clientX) {
    if (resolved || animating || !round) return;
    const g0 = metrics();
    const px = clamp(clientX, g0.xL, g0.xR);
    pivotFrac = px / g0.W;

    draw();                       // show the chosen fulcrum, rod still level
    const g = metrics();
    animating = true;
    animateTilt(g.leanDeg, g.px, g.midY, () => {
      animating = false;
      resolved = true;
      document.body.classList.add("resolved");
      recordScore(Math.abs(g.leanDeg));
      draw();                     // redraw with the full blueprint analysis
      showResult(Math.abs(g.leanDeg));
    });
  }

  function recordScore(lean) {
    stats.rounds += 1;
    stats.sum += lean;
    stats.best = Math.min(stats.best, lean);
    document.getElementById("stRounds").textContent = stats.rounds;
    document.getElementById("stBest").textContent = stats.best.toFixed(1) + "°";
    document.getElementById("stAvg").textContent = (stats.sum / stats.rounds).toFixed(1) + "°";
  }

  function showResult(lean) {
    const el = document.getElementById("score");
    const val = lean < PERFECT ? "0.0" : lean.toFixed(1);
    el.innerHTML = val + '<span class="deg">°</span>';
    document.getElementById("scoreCap").textContent = lean < PERFECT ? "balanced" : "lean";
    document.getElementById("result").classList.add("show");
    document.getElementById("tryagain").classList.add("show");
  }

  function newRound() {
    round = {
      fracL: rand(0.21, 0.28),
      fracR: rand(0.72, 0.79),
      radL:  rand(0.045, 0.085),
      radR:  rand(0.045, 0.085),
    };
    pivotFrac = null;
    resolved = false;
    animating = false;
    document.body.classList.remove("resolved");
    document.getElementById("result").classList.remove("show");
    document.getElementById("tryagain").classList.remove("show");
    draw();
  }

  // ---- events ---------------------------------------------------------------
  svg.addEventListener("click", (e) => onPick(e.clientX));
  svg.addEventListener("mousemove", (e) => {
    if (resolved || animating || pivotFrac != null) return;
    const ghost = document.getElementById("ghost");
    if (!ghost) return;
    const g = metrics();
    const x = clamp(e.clientX, g.xL, g.xR);
    ghost.setAttribute("x1", x); ghost.setAttribute("x2", x);
    ghost.setAttribute("y1", 20); ghost.setAttribute("y2", g.H - 20);
  });
  svg.addEventListener("touchstart", (e) => {
    if (e.touches[0]) onPick(e.touches[0].clientX);
    e.preventDefault();
  }, { passive: false });

  document.getElementById("againBtn").addEventListener("click", newRound);
  window.addEventListener("resize", () => { if (round) draw(); });

  // ---- intro / how-to overlay ----
  const intro = document.getElementById("intro");
  const dismissIntro = () => intro.classList.add("hide");
  intro.addEventListener("click", (e) => { if (e.target === intro || e.target.id === "beginBtn") dismissIntro(); });
  intro.addEventListener("touchstart", (e) => {
    if (e.target === intro || e.target.id === "beginBtn") { dismissIntro(); e.preventDefault(); }
  }, { passive: false });

  newRound();
})();
</script>
</body>
</html>
